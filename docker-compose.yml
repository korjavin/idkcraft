# idkcraft — Paper+Geyser server (mc) + follow bot (bot) + Baritone worker (baritone).
# No Traefik: Minecraft is raw TCP/UDP, host ports are published directly.
# Service names (mc, bot, baritone, bot2, body2) and bot env names are the
# shared contract with the bot bead (bot/**) — do not rename.
# (The laya System-1 sidecar left the stack in idkcraft-jlda.6; its code
# stays in laya/ as the rollback.)
#
# Geyser Floodgate auth is declarative (bring-up 2026-09-21 proved Geyser
# 2.11 does NOT switch to Floodgate auth just because Floodgate is
# installed — a generated config stays auth-type: online, which blocks
# Bedrock joins). an inline configs entry (via PATCH_DEFINITIONS)
# sets java.auth-type=floodgate in /data/plugins/Geyser-Spigot/config.yml.
# Timing: the file only exists after Geyser's first run, so on a truly fresh
# volume the first boot logs a patch skip warning and comes up online; the
# next start (restart/redeploy) applies floodgate, and every start after
# that keeps it. Do not vendor a full Geyser config.yml
# (drifts every Geyser release).

services:
  mc:
    # Date tag pinned 2026-09-21; this tag ships Java 25 (Paper 26.x needs >= 25).
    image: itzg/minecraft-server:${MC_IMAGE_TAG:-2026.9.1}
    container_name: ${MC_CONTAINER_NAME:-idkcraft-mc}
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "${MC_JAVA_PORT:-25565}:25565"
      - "${MC_BEDROCK_PORT:-19132}:19132/udp"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      # Pin rationale lives in .env.example (newest Paper both Geyser and
      # mineflayer support as of 2026-09-21).
      VERSION: ${MC_VERSION:-26.1.2}
      INIT_MEMORY: ${MC_INIT_MEMORY:-512M}
      MAX_MEMORY: ${MC_MAX_MEMORY:-2G}
      ONLINE_MODE: "false"
      ENFORCE_WHITELIST: "TRUE"
      # Owner 2026-10-08: hide the online-player sample in server-list pings —
      # the sample leaks whitelisted names to scanners (FishNet grief).
      HIDE_ONLINE_PLAYERS: "true"
      # Owner 2026-09-28: off — the bot is not op, and protection around world
      # spawn silently refused every dig/place there (stuck loops near spawn).
      SPAWN_PROTECTION: "0"
      # Offline UUID of IdkBot (server runs ONLINE_MODE=false, so Paper matches
      # the whitelist by UUID; a name would resolve to an online UUID and the
      # bot would be rejected). If BOT_USERNAME changes, recompute:
      # python3 -c 'import uuid,hashlib;print(uuid.UUID(bytes=hashlib.md5(b"OfflinePlayer:IdkBot").digest(),version=3))'
      WHITELIST: ${WHITELIST:-3d1f4b94-9298-3ba3-af2d-3f73ce56138f}
      OPS: ${OPS:-}
      # vewo.5: swarm (bot + bot2 + 32 helpers + worker + owners) exceeds itzg's 20.
      MAX_PLAYERS: ${MC_MAX_PLAYERS:-40}
      DIFFICULTY: ${MC_DIFFICULTY:-easy}
      MOTD: idkcraft
      # World directory name (level-name). Default keeps the original world;
      # the stack env overrides it (LEVEL=world2 in Portainer since 2026-10-08).
      LEVEL: ${LEVEL:-world}
      # x3y6.5 (owner 2026-10-17): swarm helpers get an unbreakable stone
      # pickaxe from the server (hand-dug stone is 10 s/block, drops nothing).
      # File-free on purpose: Portainer git stacks did not apply inline
      # `configs:` (datapack never landed). itzg runs one RCON command per line
      # on every client connect (it cannot say who), so each line gives only
      # to that online helper when it holds no pickaxe - idempotent, no flood.
      # Helper names follow BOT_SWARM_PREFIX. Not periodic: the pickaxe is
      # unbreakable (no wear), but one lost on death is replaced only at the
      # next connect by any client unless keepInventory is on in the world.
      # The bot's own spawn kit line can read pickaxe=no on first connect (the
      # give lands seconds after spawn); check by dig intervals instead.
      RCON_CMDS_ON_CONNECT: |
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}1] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}1] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}1 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}2] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}2] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}2 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}3] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}3] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}3 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}4] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}4] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}4 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}5] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}5] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}5 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}6] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}6] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}6 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}7] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}7] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}7 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}8] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}8] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}8 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}9] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}9] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}9 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}10] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}10] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}10 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}11] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}11] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}11 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}12] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}12] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}12 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}13] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}13] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}13 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}14] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}14] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}14 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}15] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}15] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}15 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}16] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}16] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}16 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}17] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}17] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}17 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}18] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}18] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}18 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}19] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}19] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}19 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}20] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}20] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}20 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}21] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}21] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}21 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}22] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}22] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}22 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}23] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}23] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}23 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}24] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}24] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}24 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}25] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}25] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}25 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}26] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}26] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}26 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}27] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}27] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}27 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}28] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}28] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}28 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}29] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}29] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}29 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}30] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}30] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}30 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}31] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}31] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}31 minecraft:stone_pickaxe[unbreakable={}]
        execute if entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}32] unless items entity @a[name=${BOT_SWARM_PREFIX:-IdkSwarm}32] container.* minecraft:stone_pickaxe run give ${BOT_SWARM_PREFIX:-IdkSwarm}32 minecraft:stone_pickaxe[unbreakable={}]
      PATCH_DEFINITIONS: /patches
      # Geyser/Floodgate/ViaVersion track "latest" — drift risk accepted for
      # iteration 1. ViaVersion is needed because Geyser emulates a 26.2 Java
      # client, so a Paper server below 26.2 must accept newer clients
      # (https://geysermc.org/wiki/geyser/supported-versions/); drop it once
      # the server pin reaches a version mineflayer speaks natively.
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
        https://api.spiget.org/v2/resources/19254/download
    volumes:
      - ${MC_DATA_PATH:-./data}:/data
    mem_limit: ${MC_MEM_LIMIT:-3g}
    logging:
      driver: json-file
      options:
        max-size: "20m"
    # Explicit: the amd64 itzg image variant ships no HEALTHCHECK, and
    # Portainer refuses service_healthy dependents without one. Uses the
    # image's bundled mc-health script; start_period covers first boot
    # (Paper + plugin downloads).
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 40
    configs:
      - source: geyser-floodgate
        target: /patches/geyser-floodgate.json

  bot:
    # Built by CI from ./bot (sibling bead owns bot/**) and pushed to GHCR.
    # :latest is a placeholder — CI rewrites it to the commit sha on deploy.
    image: ghcr.io/korjavin/idkcraft:ce052c0d2508d4164a2cca9731df5b00820f1565
    container_name: ${BOT_CONTAINER_NAME:-idkcraft-bot}
    restart: unless-stopped
    depends_on:
      mc:
        condition: service_healthy # itzg image ships an mc-health healthcheck
    environment:
      MC_HOST: mc
      MC_PORT: 25565
      BOT_USERNAME: ${BOT_USERNAME:-IdkBot}
      BOT2_USERNAME: ${BOT2_USERNAME:-} # peer name only: ownerOnline excludes it (neuc.45)
      BOT_FOLLOW: ${BOT_FOLLOW:-}
      BOT_LEAVE_AFTER_MS: ${BOT_LEAVE_AFTER_MS:-60000}
      BOT_AUTONOMOUS: ${BOT_AUTONOMOUS:-}
      BRAIN_TICK_MS: ${BRAIN_TICK_MS:-1000}
      BRAIN_URL: ${BRAIN_URL:-}
      BRAIN_TIMEOUT_MS: ${BRAIN_TIMEOUT_MS:-3000}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PLANNER: ${PLANNER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      GOAL_WATCHDOG_MS: ${GOAL_WATCHDOG_MS:-60000}
      GOAL_COMMIT_MS: ${GOAL_COMMIT_MS:-120000}
      GOAL_WATCHDOG_MAX_ROUNDS: ${GOAL_WATCHDOG_MAX_ROUNDS:-6}
      GOAL_TRAVEL_GRACE_MS: ${GOAL_TRAVEL_GRACE_MS:-90000}
      GOAL_PLANB_SWITCH_MS: ${GOAL_PLANB_SWITCH_MS:-450000}
      WORKER_NAME: ${WORKER_NAME:-}
      WORKER_HOST: ${WORKER_HOST:-baritone}
      WORKER_PORT: ${WORKER_PORT:-7777}
      # Flat swarm (lhg2): bot is strip 0 of BOT_SWARM_N (empty = whole square).
      BOT_SWARM_N: ${BOT_SWARM_N:-}
      BOT_SWARM_PREFIX: ${BOT_SWARM_PREFIX:-IdkSwarm} # helpers never count as players
    labels:
      prometheus.scrape: "true"
      prometheus.port: "9464"
    networks: [default, monitoring]
    volumes:
      # Bot disk memory (idkcraft-hlk): one JSON file per BOT_USERNAME at
      # /app/memory, surviving restarts and redeploys. Named volume — no
      # host path, so Portainer git stacks resolve it anywhere.
      - bot-memory:/app/memory
    logging:
      driver: json-file
      options:
        max-size: "20m"

  baritone:
    # Built by CI from ./baritone and pushed to GHCR.
    # :latest is a placeholder — CI rewrites it to the commit sha on deploy.
    image: ghcr.io/korjavin/idkcraft-baritone:1ebd7dcc61e4ba0298dd2e9dbafeadcc6217cc17
    container_name: ${BARITONE_CONTAINER_NAME:-idkcraft-baritone}
    restart: unless-stopped
    depends_on:
      mc:
        condition: service_healthy
    # No ports: the write-only bridge is reachable only on the compose
    # network (the bot's worker.js); the rig publishes it for ab.js.
    # No healthcheck: default-off (no account) sleeps, which is not unhealthy.
    mem_limit: ${BARITONE_MEM_LIMIT:-2500m}
    environment:
      # Offline worker (owner Q2 2026-10-12): 1 = launch offline under BOT
      # with no account (start.sh). The name comes from WORKER_NAME — the
      # same env the bot reads — so the two never diverge. Empty (default) =
      # idle exactly as before: no JVM, ~0 RAM.
      BARITONE_OFFLINE: ${BARITONE_OFFLINE:-}
      BOT: ${WORKER_NAME:-}
    volumes:
      # One-time owner login (baritone/README.md): the account survives
      # redeploys here. FIXED name — see the volumes block below.
      - baritone-auth:/headlessmc/HeadlessMC/auth
    logging:
      driver: json-file
      options:
        max-size: "20m"

  # v2 (idkcraft-neuc): the SAME Node logic on the Baritone body — a second
  # bot under its own name, off until BOT2_USERNAME is set (bot2 idles,
  # body2 sleeps at ~0 RAM, prod is untouched). Turning v2 on costs ~2.5g
  # RAM (the client dominates; node adds ~150m).
  bot2:
    # Same image as bot (CI rewrites :latest to the commit sha on deploy).
    image: ghcr.io/korjavin/idkcraft:ce052c0d2508d4164a2cca9731df5b00820f1565
    container_name: ${BOT2_CONTAINER_NAME:-idkcraft-bot2}
    restart: unless-stopped
    depends_on:
      mc:
        condition: service_healthy
    environment:
      MC_HOST: mc
      MC_PORT: 25565
      BOT_BODY: baritone
      BOT_USERNAME: ${BOT2_USERNAME:-}
      # g0z.59: v2 reads (never writes) v1's complete castle from v1's
      # memory file on the shared volume, so it sleeps inside it too.
      BOT_CASTLE_PEER: ${BOT_USERNAME:-IdkBot}
      # v1's name for ownerOnline (neuc.45); bot2's BOT_USERNAME is its own
      BOT_PEER_USERNAME: ${BOT_USERNAME:-IdkBot}
      # vewo.2: swarm chat sieve (swarm lines are never orders). BOT_SWARM_I -1
      # = no strip: bot2 does not split a flat (unset would mean strip 0).
      BOT_SWARM_N: ${BOT_SWARM_N:-}
      BOT_SWARM_PREFIX: ${BOT_SWARM_PREFIX:-IdkSwarm}
      BOT_SWARM_I: "-1"
      BOT_FOLLOW: ${BOT_FOLLOW:-}
      BOT_LEAVE_AFTER_MS: ${BOT_LEAVE_AFTER_MS:-60000}
      BOT_AUTONOMOUS: ${BOT_AUTONOMOUS:-}
      BRAIN_TICK_MS: ${BRAIN_TICK_MS:-1000}
      BRAIN_URL: ${BRAIN_URL:-}
      BRAIN_TIMEOUT_MS: ${BRAIN_TIMEOUT_MS:-3000}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PLANNER: ${PLANNER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      GOAL_WATCHDOG_MS: ${GOAL_WATCHDOG_MS:-60000}
      GOAL_COMMIT_MS: ${GOAL_COMMIT_MS:-120000}
      GOAL_WATCHDOG_MAX_ROUNDS: ${GOAL_WATCHDOG_MAX_ROUNDS:-6}
      GOAL_TRAVEL_GRACE_MS: ${GOAL_TRAVEL_GRACE_MS:-90000}
      GOAL_PLANB_SWITCH_MS: ${GOAL_PLANB_SWITCH_MS:-450000}
      # No worker on v2 (empty, never inherits WORKER_NAME: one worker
      # serves one head); WORKER_HOST/PORT below stay inert without it.
      WORKER_NAME: ""
      WORKER_HOST: ${WORKER_HOST:-baritone}
      WORKER_PORT: ${WORKER_PORT:-7777}
      BRIDGE_HOST: body2
      BRIDGE_PORT: 7778
      BRIDGE_CONSOLE_PORT: 7777
    labels:
      prometheus.scrape: "true"
      prometheus.port: "9464"
    networks: [default, monitoring]
    volumes:
      # Same named volume as bot: one JSON file per BOT_USERNAME, so the
      # two bots never collide.
      - bot-memory:/app/memory
    logging:
      driver: json-file
      options:
        max-size: "20m"

  # v2 body (idkcraft-neuc): the baritone image offline under BOT2_USERNAME.
  # Empty name (default) = start.sh idles with no JVM at ~0 RAM. No ports:
  # bot2 reaches the console bridge (7777) and the mod ws (7778) on the
  # compose network. No auth volume (offline only: a stored account would
  # shadow the name — baritone/README.md).
  body2:
    image: ghcr.io/korjavin/idkcraft-baritone:1ebd7dcc61e4ba0298dd2e9dbafeadcc6217cc17
    container_name: ${BODY2_CONTAINER_NAME:-idkcraft-body2}
    restart: unless-stopped
    depends_on:
      mc:
        condition: service_healthy
    mem_limit: ${BODY2_MEM_LIMIT:-2500m}
    environment:
      BARITONE_OFFLINE: "1"
      # The bridge mod needs baritone/api/**, which only the API jar keeps:
      # start.sh swaps it in only with BARITONE_API=1 (the rig boot passes
      # the same, stuck-run.sh REPLAY_BODY). Without it the mod logs
      # "standalone Baritone has no Java API", never opens :7778, and bot2
      # can neither connect nor join (idkcraft-neuc.19). Worker untouched.
      BARITONE_API: "1"
      BOT: ${BOT2_USERNAME:-}
      # idkcraft-neuc.67: extra game-JVM args (heap/GC), appended by start.sh.
      BODY_JVM_ARGS: ${BODY_JVM_ARGS:-}
    logging:
      driver: json-file
      options:
        max-size: "20m"

  # Flat swarm (idkcraft-lhg2): 32 extra v1 (mineflayer) bots named
  # <BOT_SWARM_PREFIX>1..32 (default IdkSwarm1..32) that split one `flat` square into BOT_SWARM_N strips
  # (bot = strip 0, swarmK = strip K). Off by default: swarm K idles (no
  # join, ~40m RAM) unless K < BOT_SWARM_N — BOT_SWARM_N=33 turns all 32 on.
  # Each needs its OFFLINE uuid in WHITELIST (same as BOT_USERNAME). Own
  # memory file /app/memory/<name>.json on the shared volume. No planner
  # keys (stub brain), no worker, no follow.
  swarm1: &swarm
    image: ghcr.io/korjavin/idkcraft:ce052c0d2508d4164a2cca9731df5b00820f1565
    container_name: ${SWARM_CONTAINER_PREFIX:-idkcraft-swarm}1
    restart: unless-stopped
    depends_on:
      mc:
        condition: service_healthy
    mem_limit: ${BOT_SWARM_MEM_LIMIT:-400m}
    # Idle slot (I >= N or N empty): sleep instead of starting node (~1 MiB vs ~30).
    command:
      - sh
      - -c
      - 'if [ "$${BOT_SWARM_N:-0}" -le "$$BOT_SWARM_I" ] 2>/dev/null; then echo "swarm idle: BOT_SWARM_I >= BOT_SWARM_N"; exec sleep infinity; fi; exec node src/index.js'
    environment: &swarm-env
      MC_HOST: mc
      MC_PORT: 25565
      BOT_USERNAME: ${BOT_SWARM_PREFIX:-IdkSwarm}1
      BOT_SWARM_I: "1"
      BOT_SWARM_N: ${BOT_SWARM_N:-}
      BOT_SWARM_PREFIX: ${BOT_SWARM_PREFIX:-IdkSwarm}
      BOT_PEER_USERNAME: ${BOT_USERNAME:-IdkBot}
      BOT2_USERNAME: ${BOT2_USERNAME:-}
