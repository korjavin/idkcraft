# idkcraft — Paper+Geyser server (mc) + follow bot (bot) + Baritone worker (baritone).
# No Traefik: Minecraft is raw TCP/UDP, host ports are published directly.
# Service names (mc, bot, baritone) and bot env names are the shared contract
# with the bot bead (bot/**) — do not rename.
# (The laya System-1 sidecar left the stack in idkcraft-jlda.6; its code
# stays in laya/ as the rollback.)
#
# Geyser Floodgate auth is declarative (bring-up 2026-09-21 proved Geyser
# 2.11 does NOT switch to Floodgate auth just because Floodgate is
# installed — a generated config stays auth-type: online, which blocks
# Bedrock joins). an inline configs entry (via PATCH_DEFINITIONS)
# sets java.auth-type=floodgate in /data/plugins/Geyser-Spigot/config.yml.
# Timing: the file only exists after Geyser's first run, so on a truly fresh
# volume the first boot logs a patch skip warning and comes up online; the
# next start (restart/redeploy) applies floodgate, and every start after
# that keeps it. Do not vendor a full Geyser config.yml
# (drifts every Geyser release).

services:
  mc:
    # Date tag pinned 2026-09-21; this tag ships Java 25 (Paper 26.x needs >= 25).
    image: itzg/minecraft-server:${MC_IMAGE_TAG:-2026.9.1}
    container_name: ${MC_CONTAINER_NAME:-idkcraft-mc}
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "${MC_JAVA_PORT:-25565}:25565"
      - "${MC_BEDROCK_PORT:-19132}:19132/udp"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      # Pin rationale lives in .env.example (newest Paper both Geyser and
      # mineflayer support as of 2026-09-21).
      VERSION: ${MC_VERSION:-26.1.2}
      INIT_MEMORY: ${MC_INIT_MEMORY:-512M}
      MAX_MEMORY: ${MC_MAX_MEMORY:-2G}
      ONLINE_MODE: "false"
      ENFORCE_WHITELIST: "TRUE"
      # Owner 2026-10-08: hide the online-player sample in server-list pings —
      # the sample leaks whitelisted names to scanners (FishNet grief).
      HIDE_ONLINE_PLAYERS: "true"
      # Owner 2026-09-28: off — the bot is not op, and protection around world
      # spawn silently refused every dig/place there (stuck loops near spawn).
      SPAWN_PROTECTION: "0"
      # Offline UUID of IdkBot (server runs ONLINE_MODE=false, so Paper matches
      # the whitelist by UUID; a name would resolve to an online UUID and the
      # bot would be rejected). If BOT_USERNAME changes, recompute:
      # python3 -c 'import uuid,hashlib;print(uuid.UUID(bytes=hashlib.md5(b"OfflinePlayer:IdkBot").digest(),version=3))'
      WHITELIST: ${WHITELIST:-3d1f4b94-9298-3ba3-af2d-3f73ce56138f}
      OPS: ${OPS:-}
      DIFFICULTY: ${MC_DIFFICULTY:-easy}
      MOTD: idkcraft
      # World directory name (level-name). Default keeps the original world;
      # the stack env overrides it (LEVEL=world2 in Portainer since 2026-10-08).
      LEVEL: ${LEVEL:-world}
      PATCH_DEFINITIONS: /patches
      # Geyser/Floodgate/ViaVersion track "latest" — drift risk accepted for
      # iteration 1. ViaVersion is needed because Geyser emulates a 26.2 Java
      # client, so a Paper server below 26.2 must accept newer clients
      # (https://geysermc.org/wiki/geyser/supported-versions/); drop it once
      # the server pin reaches a version mineflayer speaks natively.
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
        https://api.spiget.org/v2/resources/19254/download
    volumes:
      - ${MC_DATA_PATH:-./data}:/data
    mem_limit: ${MC_MEM_LIMIT:-3g}
    logging:
      driver: json-file
      options:
        max-size: "20m"
    # Explicit: the amd64 itzg image variant ships no HEALTHCHECK, and
    # Portainer refuses service_healthy dependents without one. Uses the
    # image's bundled mc-health script; start_period covers first boot
    # (Paper + plugin downloads).
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 40
    configs:
      - source: geyser-floodgate
        target: /patches/geyser-floodgate.json

  bot:
    # Built by CI from ./bot (sibling bead owns bot/**) and pushed to GHCR.
    # :latest is a placeholder — CI rewrites it to the commit sha on deploy.
    image: ghcr.io/korjavin/idkcraft:latest
    container_name: ${BOT_CONTAINER_NAME:-idkcraft-bot}
    restart: unless-stopped
    depends_on:
      mc:
        condition: service_healthy # itzg image ships an mc-health healthcheck
    environment:
      MC_HOST: mc
      MC_PORT: 25565
      BOT_USERNAME: ${BOT_USERNAME:-IdkBot}
      BOT_FOLLOW: ${BOT_FOLLOW:-}
      BOT_LEAVE_AFTER_MS: ${BOT_LEAVE_AFTER_MS:-60000}
      BOT_AUTONOMOUS: ${BOT_AUTONOMOUS:-}
      BRAIN_TICK_MS: ${BRAIN_TICK_MS:-1000}
      BRAIN_URL: ${BRAIN_URL:-}
      BRAIN_TIMEOUT_MS: ${BRAIN_TIMEOUT_MS:-3000}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PLANNER: ${PLANNER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      GOAL_WATCHDOG_MS: ${GOAL_WATCHDOG_MS:-60000}
      GOAL_COMMIT_MS: ${GOAL_COMMIT_MS:-120000}
      GOAL_WATCHDOG_MAX_ROUNDS: ${GOAL_WATCHDOG_MAX_ROUNDS:-6}
      GOAL_TRAVEL_GRACE_MS: ${GOAL_TRAVEL_GRACE_MS:-90000}
      GOAL_PLANB_SWITCH_MS: ${GOAL_PLANB_SWITCH_MS:-450000}
      WORKER_NAME: ${WORKER_NAME:-}
      WORKER_HOST: ${WORKER_HOST:-baritone}
      WORKER_PORT: ${WORKER_PORT:-7777}
    labels:
      prometheus.scrape: "true"
      prometheus.port: "9464"
    networks: [default, monitoring]
    volumes:
      # Bot disk memory (idkcraft-hlk): one JSON file per BOT_USERNAME at
      # /app/memory, surviving restarts and redeploys. Named volume — no
      # host path, so Portainer git stacks resolve it anywhere.
      - bot-memory:/app/memory
    logging:
      driver: json-file
      options:
        max-size: "20m"

  baritone:
    # Built by CI from ./baritone and pushed to GHCR.
    # :latest is a placeholder — CI rewrites it to the commit sha on deploy.
    image: ghcr.io/korjavin/idkcraft-baritone:latest
    container_name: ${BARITONE_CONTAINER_NAME:-idkcraft-baritone}
    restart: unless-stopped
    depends_on:
      mc:
        condition: service_healthy
    # No ports: the write-only bridge is reachable only on the compose
    # network (the bot's worker.js); the rig publishes it for ab.js.
    # No healthcheck: default-off (no account) sleeps, which is not unhealthy.
    mem_limit: ${BARITONE_MEM_LIMIT:-2500m}
    environment:
      # Offline worker (owner Q2 2026-10-12): 1 = launch offline under BOT
      # with no account (start.sh). The name comes from WORKER_NAME — the
      # same env the bot reads — so the two never diverge. Empty (default) =
      # idle exactly as before: no JVM, ~0 RAM.
      BARITONE_OFFLINE: ${BARITONE_OFFLINE:-}
      BOT: ${WORKER_NAME:-}
    volumes:
      # One-time owner login (baritone/README.md): the account survives
      # redeploys here. FIXED name — see the volumes block below.
      - baritone-auth:/headlessmc/HeadlessMC/auth
    logging:
      driver: json-file
      options:
        max-size: "20m"
# Host monitoring stack (korjavin/monitoring-compose): its vmagent
# discovers containers labelled prometheus.scrape=true, but can only reach
# them on a network it is attached to. Locally without that stack:
#   docker network create monitoring_internal
networks:
  monitoring:
    external: true
    name: ${MONITORING_NETWORK:-monitoring_internal}

volumes:
  # Bot disk memory (idkcraft-hlk): homes, resource finds, explored chunks
  # and danger spots. Named volume, no host bind.
  bot-memory:
  # Baritone worker auth (one-time owner login). FIXED name: Portainer
  # prefixes anonymous volumes with the stack name, which would orphan the
  # login on every stack rename — idkcraft-baritone-auth stays put whatever
  # the stack is called. NOT external: a missing external volume would
  # refuse the whole stack.
  baritone-auth:
    name: idkcraft-baritone-auth

configs:
  # Inline patch definition (no bind mount: Portainer git stacks resolve
  # binds on the host, where the repo path does not exist). Single source
  # of truth — there is no mc/patches/ file.
  geyser-floodgate:
    content: |
      {"file": "/data/plugins/Geyser-Spigot/config.yml",
       "ops": [{"$$set": {"path": "$$.java['auth-type']", "value": "floodgate"}}]}
