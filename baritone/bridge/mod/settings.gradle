// idkcraft-neuc.1: Unimined (not Loom) — both 26.1.2 mods in our image
// (Baritone 1.18.0, hmc-specifics 2.5.0) build with Unimined 1.4.2-SNAPSHOT:
// Mojang publishes no mappings and Fabric publishes no yarn for 26.x (the
// jars ship Mojang-named), so Loom's officialMojangMappings() cannot resolve.
// The snapshot is pinned timestamped for reproducibility.
pluginManagement {
    repositories {
        maven { url = 'https://maven.wagyourtail.xyz/snapshots/' }
        maven { url = 'https://maven.wagyourtail.xyz/releases/' }
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'idkcraft-bridge'
