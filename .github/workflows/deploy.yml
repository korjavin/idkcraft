name: Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Process audit 2026-09-29: until now CI ran zero tests and "suite green"
  # was only the agent's word in the PR. Red tests block the deploy job.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: cd bot && npm ci && npm test

  # idkcraft-oqul.2: the ~9 min task-run.sh oracle suite moved out of npm
  # test (kept < 60 s); a parallel job keeps it gating the deploy.
  test-slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: cd bot && npm ci && npm run test:slow

  # idkcraft-jlda.9: the deploy job only runs on master, so a broken
  # baritone image build (ADD --checksum mismatch) passed PR CI and broke
  # master. This PR-only job exercises the same build without pushing.
  build-baritone:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build baritone image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./baritone
          push: false
          cache-from: type=gha,scope=baritone

  deploy:
    needs: [test, test-slow]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose config
        run: |
          docker compose --env-file .env.example config -q

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tag each image by its directory TREE hash, so pushes that change
      # neither bot/ nor baritone/ rebuild nothing (host disk filled
      # up from one image per push; Portainer never prunes old tags).
      # Content-addressed: a revert or rebase reuses the existing image.
      # A docs-only push still redeploys with the same tags — intended,
      # no new image lands.
      - name: Resolve image tags
        run: |
          BOT_SHA=$(git rev-parse HEAD:bot)
          BARITONE_SHA=$(git rev-parse HEAD:baritone)
          [ -n "$BOT_SHA" ] && [ -n "$BARITONE_SHA" ] || exit 1
          echo "BOT_SHA=${BOT_SHA}" >> "$GITHUB_ENV"
          echo "BARITONE_SHA=${BARITONE_SHA}" >> "$GITHUB_ENV"

      - name: Check bot image
        id: check-bot
        env:
          IMAGE_BASE: ghcr.io/korjavin/idkcraft
          BOT_SHA: ${{ env.BOT_SHA }}
        run: |
          if docker manifest inspect "${IMAGE_BASE}:${BOT_SHA}" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        if: steps.check-bot.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./bot
          push: true
          tags: ghcr.io/korjavin/idkcraft:${{ env.BOT_SHA }}

      - name: Check baritone image
        id: check-baritone
        env:
          BARITONE_IMAGE: ghcr.io/korjavin/idkcraft-baritone
          BARITONE_SHA: ${{ env.BARITONE_SHA }}
        run: |
          if docker manifest inspect "${BARITONE_IMAGE}:${BARITONE_SHA}" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # The build downloads the vanilla client (~100 MB) — cached in GHA.
      - name: Build and push baritone image
        if: steps.check-baritone.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./baritone
          push: true
          tags: ghcr.io/korjavin/idkcraft-baritone:${{ env.BARITONE_SHA }}
          cache-from: type=gha,scope=baritone
          cache-to: type=gha,mode=max,scope=baritone

      - name: Update deploy branch
        env:
          IMAGE_BASE: ghcr.io/korjavin/idkcraft
          BARITONE_IMAGE: ghcr.io/korjavin/idkcraft-baritone
          BOT_SHA: ${{ env.BOT_SHA }}
          BARITONE_SHA: ${{ env.BARITONE_SHA }}
          GITHUB_COMMIT_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B deploy
          sed -i "s|image: ${IMAGE_BASE}:.*|image: ${IMAGE_BASE}:${BOT_SHA}|" docker-compose.yml
          sed -i "s|image: ${BARITONE_IMAGE}:.*|image: ${BARITONE_IMAGE}:${BARITONE_SHA}|" docker-compose.yml
          if ! grep -q "image: ${IMAGE_BASE}:${BOT_SHA}" docker-compose.yml || ! grep -q "image: ${BARITONE_IMAGE}:${BARITONE_SHA}" docker-compose.yml; then
            echo "compose image line not rewritten"
            exit 1
          fi
          git add docker-compose.yml
          git commit -m "deploy: ${GITHUB_COMMIT_SHA}"
          git push origin deploy --force

      - name: Trigger Portainer webhook
        uses: distributhor/workflow-webhook@2381f0e9c7b6bf061fb1405bd0804b8706116369 # v3.0.8
        with:
          webhook_url: ${{ secrets.PORTAINER_REDEPLOY_HOOK }}
